<style>
/*FONTS*/
/* Layout: a dark cinema hall, the 16:9 screen centred, simple projector controls beneath. Single committed dark look. */
:root{
  --hall:#140c0a; --curtain:#5e1414; --gold:#e3b04b; --cream:#f3e6c4; --ink:#2a1a10; --dim:#a8907a;

}
html,body{height:100%}

  background-image:radial-gradient(ellipse at 50% 0%,#3a1610 0%,var(--hall) 70%)}
.hall{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.marquee{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.marquee h1{font-family:var(--display);font-weight:400;color:var(--gold);margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:.04em;text-wrap:balance}
.marquee p{margin:0;color:var(--dim);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border:6px solid #2b1a12;box-shadow:0 0 0 2px #6b4a2a,0 20px 60px #000}
canvas{width:100%;height:100%;display:block}
.big{position:absolute;inset:0;margin:auto;width:min(150px,28%);height:min(150px,28%);aspect-ratio:1;border-radius:50%;border:4px solid var(--gold);background:rgba(20,10,6,.75);color:var(--gold);font-size:clamp(28px,6vw,60px);cursor:pointer;display:flex;align-items:center;justify-content:center}
.big:focus-visible,.bar button:focus-visible,#seek:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px}
.bar button{background:var(--curtain);color:var(--cream);border:1px solid var(--gold);border-radius:4px;font-family:var(--text);font-weight:700;padding:6px 12px;cursor:pointer;min-width:44px}
#seek{flex:1;min-width:0;accent-color:var(--gold)}
#time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px;white-space:nowrap}
.note{color:var(--dim);font-size:14px;line-height:1.5;max-width:65ch;margin:0}
</style>

<div class="hall">
  <div class="marquee"><h1>Nucu &amp; Bobo în „Ghinda Fermecată”</h1><p>Desen animat · 5 minute · fără dialog</p></div>

  <div class="bar">
    <button id="play" aria-label="Pornește sau oprește">&#9654;</button>
    <button id="restart" aria-label="De la început">&#8634;</button>
    <input id="seek" type="range" min="0" max="300" step="0.1" value="0" aria-label="Poziție în film">
    <span id="time">0:00 / 5:00</span>
    <button id="fs" aria-label="Ecran complet">&#x26F6;</button>
  </div>
  <p class="note">O veveriță și un ursuleț află ce îi trebuie unei ghinde ca să devină stejar: pământ, apă, soare și răbdare. Cu muzică și efecte sonore, ca în desenele animate de altădată. Apăsați Play pentru sunet.</p>
</div>

  case'clar':{const f=mtof(e.n);const o=ctx.createOscillator(),fl=ctx.createBiquadFilter(),gn=ctx.createGain();o.type='square';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=1500;env(ctx,gn,t,.03,.06,.15,Math.max(0,(e.d||.25)-.1));o.connect(fl);fl.connect(gn);gn.connect(out);vib(o,t,5,f*.008,ctx);o.start(t);o.stop(t+(e.d||.25)+.3);break}
  case'brush':noise(ctx,out,t,.08,.025,'highpass',5000);break;
  case'click':noise(ctx,out,t,.012,.03+e.v*.05,'bandpass',1500+e.v*3000,null,.7);break;
  case'beep':osc(ctx,out,'sine',1000,t,.25,.2,.005);break;
  case'pop':osc(ctx,out,'sine',500,t,.12,.35,.003,(p,t)=>p.exponentialRampToValueAtTime(1400,t+.07));break;
  case'boing':{const o=osc(ctx,out,'sine',160,t,.7,.35,.005,(p,t)=>{p.exponentialRampToValueAtTime(420,t+.15);p.exponentialRampToValueAtTime(180,t+.7)});vib(o,t,16,50,ctx);break}

  case'crunch':for(let i=0;i<4;i++)noise(ctx,out,t+i*.05,.06,.35,'bandpass',1800+i*400,null,2);break;
  case'slideUp':case'slideDown':{const d=e.d||.6;const up=k==='slideUp';const o=osc(ctx,out,'sine',up?320:1300,t,d,.2,.03,(p,t)=>p.exponentialRampToValueAtTime(up?1300:300,t+d));vib(o,t,6,18,ctx);break}
  case'thud':osc(ctx,out,'sine',140,t,.25,.5,.003,(p,t)=>p.exponentialRampToValueAtTime(45,t+.2));break;
  case'sparkle':for(let i=0;i<6;i++)osc(ctx,out,'sine',2000+i*260,t+i*.06,.25,.07);break;
  case'swoosh':noise(ctx,out,t,.35,.25,'bandpass',400,3500,2);break;
  case'whistle':{const o=osc(ctx,out,'sine',1300,t,.25,.18,.02,(p,t)=>p.exponentialRampToValueAtTime(2300,t+.22));osc(ctx,out,'sine',1500,t+.35,.45,.18,.02,(p,t)=>{p.exponentialRampToValueAtTime(2400,t+.12);p.exponentialRampToValueAtTime(1200,t+.4)});break}
  case'whistleTune':[79,81,79,76,79,84,83,79,76].forEach((n,i)=>{const o=osc(ctx,out,'sine',mtof(n+12),t+i*.5,.42,.07,.03);vib(o,t+i*.5,6,15,ctx)});break;

  case'drip':osc(ctx,out,'sine',1800,t,.08,.12,.002,(p,t)=>p.exponentialRampToValueAtTime(900,t+.07));break;
  case'pat':noise(ctx,out,t,.07,.4,'lowpass',400);break;

function masterChain(ctx){const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;const gn=ctx.createGain();gn.gain.value=.9;lp.connect(comp);comp.connect(gn);gn.connect(ctx.destination);return lp}

// ================= player =================
let actx=null,bus=null,startAt=0,ptr=0,playing=false,curT=0,raf=0;
const $=id=>document.getElementById(id);
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function newBus(){if(bus){try{bus.disconnect()}catch(e){}}bus=actx.createGain();bus.connect(masterChain(actx))}
function seekTo(t){curT=clamp(t,0,TOTAL);if(actx){newBus();startAt=actx.currentTime+.05-curT;ptr=EVENTS.findIndex(e=>e.t>=curT);if(ptr<0)ptr=EVENTS.length}drawFrame(curT);ui()}
function schedule(){const now=actx.currentTime-startAt;while(ptr<EVENTS.length&&EVENTS[ptr].t<now+.6){const e=EVENTS[ptr++];if(e.t>=now-.05)play(actx,bus,e,startAt+e.t)}}
function loop(){if(!playing)return;curT=actx.currentTime-startAt;if(curT>=TOTAL){curT=TOTAL;pause();return}schedule();drawFrame(curT);ui();raf=requestAnimationFrame(loop)}
async function start(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();newBus();seekTo(curT>=TOTAL-.1?0:curT)}
  if(curT>=TOTAL-.1)seekTo(0);await actx.resume();playing=true;$('bigplay').hidden=true;cancelAnimationFrame(raf);loop();ui()}
function pause(){playing=false;if(actx)actx.suspend();$('bigplay').hidden=false;ui()}
function ui(){$('play').innerHTML=playing?'&#10074;&#10074;':'&#9654;';$('time').textContent=fmt(curT)+' / '+fmt(TOTAL);if(document.activeElement!==$('seek'))$('seek').value=curT}
$('bigplay').onclick=start;$('play').onclick=()=>playing?pause():start();
$('restart').onclick=()=>{seekTo(0);if(!playing)start()};
$('seek').oninput=e=>{seekTo(+e.target.value)};
$('fs').onclick=()=>{const s=document.querySelector('.screen');try{(s.requestFullscreen||s.webkitRequestFullscreen).call(s)}catch(e){}};
cv.onclick=()=>playing?pause():start();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?pause():start()}});

// ================= render hooks (for video export) =================
window.__film={TOTAL,drawFrame,
  async renderAudio(){const sr=44100;const oc=new OfflineAudioContext(2,sr*TOTAL,sr);const out=masterChain(oc);EVENTS.forEach(e=>play(oc,out,e,e.t));const buf=await oc.startRendering();
    const L=buf.getChannelData(0),R=buf.getChannelData(1);const n=L.length;const dv=new DataView(new ArrayBuffer(44+n*4));
    const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
    for(let i=0;i<n;i++){dv.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);dv.setInt16(46+i*4,clamp(R[i],-1,1)*32767,true)}
    window.__wav=new Uint8Array(dv.buffer);return window.__wav.length},
  wavChunk(i,size){const a=window.__wav.subarray(i,i+size);let s='';for(let j=0;j<a.length;j+=8192)s+=String.fromCharCode.apply(null,a.subarray(j,j+8192));return btoa(s)}};
